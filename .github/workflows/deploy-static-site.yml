name: Deploy static site to AWS

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

concurrency:
  group: deploy-static-site-production
  cancel-in-progress: true

env:
  AWS_REGION: ${{ vars.AWS_REGION }}
  S3_BUCKET: ${{ vars.S3_BUCKET }}
  CLOUDFRONT_DISTRIBUTION_ID: ${{ vars.CLOUDFRONT_DISTRIBUTION_ID }}
  DEPLOY_ROLE_ARN: ${{ vars.DEPLOY_ROLE_ARN }}
  DIST_PATH: dist/mousecat-lab/browser

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Validate required variables
        run: |
          test -n "$AWS_REGION"
          test -n "$S3_BUCKET"
          test -n "$CLOUDFRONT_DISTRIBUTION_ID"
          test -n "$DEPLOY_ROLE_ARN"

      - name: Install dependencies
        run: npm ci

      - name: Build Angular app
        run: npm run build

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Upload HTML with no-cache headers
        run: |
          aws s3 cp "$DIST_PATH/index.html" "s3://$S3_BUCKET/index.html" \
            --cache-control "no-cache,no-store,must-revalidate" \
            --content-type "text/html"

      - name: Upload JavaScript and CSS with immutable cache headers
        run: |
          aws s3 sync "$DIST_PATH" "s3://$S3_BUCKET" --delete \
            --exclude "*" \
            --include "*.js" \
            --include "*.css" \
            --cache-control "public,max-age=31536000,immutable"

      - name: Upload static assets with short cache headers
        run: |
          aws s3 sync "$DIST_PATH" "s3://$S3_BUCKET" --delete \
            --exclude "*.js" \
            --exclude "*.css" \
            --exclude "index.html" \
            --cache-control "public,max-age=300"

      - name: Invalidate CloudFront cache
        run: |
          aws cloudfront create-invalidation \
            --distribution-id "$CLOUDFRONT_DISTRIBUTION_ID" \
            --paths "/*"
